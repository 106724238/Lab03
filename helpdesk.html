<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="description" content="Book a help desk appointment at CWA" />
  <meta name="keywords" content="help desk, appointment, form, CWA" />
  <meta name="author" content="Your Name" />
  <title>CWA Help Desk Appointment</title>
</head>
<body>
  <img src="images/logo.png" alt="CWA logo" width="199" height="100" />
  <h1>CWA Help Desk Appointment</h1>

  <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">

    <fieldset>
      <legend>Your Details</legend>
      <p><label for="firstname">First Name</label>
        <input type="text" name="firstname" id="firstname" maxlength="25" size="25" required="required" pattern="[A-Za-z ]{1,25}" title="Letters only, maximum 25 characters" />
      </p>
      <p><label for="lastname">Last Name</label>
        <input type="text" name="lastname" id="lastname" maxlength="25" size="25" required="required" pattern="[A-Za-z ]{1,25}" title="Letters only, maximum 25 characters" />
      </p>
      <p><label for="studentid">Student ID</label>
        <input type="text" name="studentid" id="studentid" maxlength="7" size="7" required="required" pattern="\d{7}" title="Exactly 7 digits" />
      </p>
      <p><label for="email">Email</label>
        <input type="email" name="email" id="email" required="required" />
      </p>
      <p><label for="phone">Phone</label>
        <input type="text" name="phone" id="phone" maxlength="10" size="10" required="required" pattern="0\d{9}" title="10 digits starting with 0" />
      </p>
    </fieldset>

    <fieldset>
      <legend>Appointment Details</legend>
      <p><label for="campus">Campus</label>
        <select name="campus" id="campus" required="required">
          <option value="">Please Select</option>
          <option value="hawthorn">Hawthorn</option>
          <option value="sarawak">Sarawak</option>
          <option value="online">Online</option>
        </select>
      </p>
      <p><label for="date">Date</label>
        <input type="text" name="date" id="date" placeholder="dd-mm-yyyy" maxlength="10" size="10" required="required" pattern="(0[1-9]|[12][0-9]|3[01])-(0[1-9]|1[0-2])-\d{4}" title="Format: dd-mm-yyyy" />
      </p>
      <p><label for="time">Time</label>
        <input type="text" name="time" id="time" placeholder="hh:mm" maxlength="5" size="5" required="required" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" title="24-hour format: hh:mm" />
      </p>

      <fieldset>
        <legend>Type of Help</legend>
        <p><label for="hardware">Hardware</label>
          <input type="radio" id="hardware" name="helptype" value="hardware" required="required" />
        </p>
        <p><label for="software">Software</label>
          <input type="radio" id="software" name="helptype" value="software" />
        </p>
        <p><label for="network">Network</label>
          <input type="radio" id="network" name="helptype" value="network" />
        </p>
      </fieldset>

      <fieldset>
        <legend>Services Needed</legend>
        <p><label for="install">Installation</label>
          <input type="checkbox" id="install" name="service[]" value="install" checked="checked" />
        </p>
        <p><label for="repair">Repair</label>
          <input type="checkbox" id="repair" name="service[]" value="repair" />
        </p>
        <p><label for="advice">Advice</label>
          <input type="checkbox" id="advice" name="service[]" value="advice" />
        </p>
      </fieldset>

      <p><label for="description">Description</label><br />
        <textarea id="description" name="description" rows="4" cols="40" placeholder="Describe your problem" required="required"></textarea>
      </p>
    </fieldset>

    <input type="submit" value="Book Appointment" />
    <input type="reset" value="Reset Form" />
  </form>
</body>
</html>
