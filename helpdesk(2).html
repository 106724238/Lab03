<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book a CWA help desk appointment">
    <meta name="keywords" content="CWA, help desk, appointment, form">
    <meta name="author" content="Your Name">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
    <a href="http://www.swin.edu.au">
        <img src="images/logo.png" alt="Swinburne logo">
    </a>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">

    <fieldset>
        <legend>Student details</legend>

        <label for="studentID">Student ID</label>
        <input pattern="\d{7,10}" title="Enter between 7 and 10 digits" type="text" id="studentID" name="studentID" maxlength="10" required> <br> <br>

        <label for="GivenName">Given Name</label>
        <input pattern="[A-Za-z]+" title="Letters only" type="text" id="GivenName" name="GivenName" maxlength="15" required>

        <label for="FamilyName">Family Name</label>
        <input pattern="[A-Za-z]+" title="Letters only" type="text" id="FamilyName" name="FamilyName" maxlength="15" required>
    </fieldset>

    <fieldset>
        <legend>Your Unit</legend>

        <input type="radio" id="COS10011" name="unit" value="COS10011" required>
        <label for="COS10011">COS10011</label>
        <input type="radio" id="COS60004" name="unit" value="COS60004">
        <label for="COS60004">COS60004</label>
        <input type="radio" id="COS60007" name="unit" value="COS60007">
        <label for="COS60007">COS60007</label> <br>

        <label for="YourTutor">Your Tutor</label>
        <select id="YourTutor" name="YourTutor" required>
            <option value="">Please Select</option>
            <option value="tutor1">Tutor 1</option>
            <option value="tutor2">Tutor 2</option>
            <option value="tutor3">Tutor 3</option>
        </select>
    </fieldset>

    <fieldset>
        <legend>Issue</legend>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="issue[]" value="html" checked="checked">
        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="issue[]" value="css">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" id="javascript" name="issue[]" value="javascript">
        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="issue[]" value="php">
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="issue[]" value="mysql"> <br> <br>

        <label for="Description">Description of Issue</label> <br>
        <textarea id="Description" name="Description" rows="4" cols="50" placeholder="Write Description of your problem here..."></textarea>
    </fieldset>

    <fieldset>
        <legend>Preferred Date/ Time</legend>
        <label for="date">Date</label>
        <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" maxlength="10"
            pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{4}" title="Format: dd/mm/yyyy" required> <br>
        <label for="time">Time</label>
        <input type="text" id="time" name="time" placeholder="00:00" maxlength="5"
            pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" title="Format: hh:mm" required>
    </fieldset>

    <input type="submit" value="Book">
    <input type="reset" value="Reset Form">

    </form>
</body>
</html>
